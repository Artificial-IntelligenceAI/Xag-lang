[package]
name = "xag-oracle"
version = "0.1.0"
edition = "2021"
description = "Generates Xag programs and asks every engine whether they agree"

# No dependencies on purpose. The random numbers and the threading are both a
# few lines each, and a fuzzer is the last place to want a supply chain.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
