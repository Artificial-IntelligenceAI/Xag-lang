# What this project has decided, once, for every file in it.
#
# Settings come in two kinds and they do not cost the same. One changes what a
# program *answers*, and every value of it is a separate language that all three
# engines must agree under. The other changes what gets *delivered*, and costs
# nothing to test.

[defaults]
# Changes what a program answers. `truncated` rounds toward zero and the
# remainder follows the dividend, which is what a processor does. `floored`
# rounds toward negative infinity and the remainder follows the divisor, which
# is what a mathematician means and what makes `n mod k` always land in `0..k`.
division = "truncated"

# Also changes what a program answers. `wrap` puts a sum that does not fit back
# into the type, as a processor does; `stop` stops instead, in the same place
# and for the same reason in every engine.
overflow = "wrap"

# Also changes what a program answers. `stops-early` means `and` asks its right
# side only when the left was true, and `or` only when it was false. The reason
# it is the default is not speed: under `asks-both` a guard like
# `('n' !== *0*) and ((*100* / 'n') > *5*)` does not waste a division, it stops.
logic = "stops-early"

# Also changes what a program answers, and the only one about text. What counts
# as one character of a `str`, which is what `count` counts.
#
# `count['café']` is 4 either way. `count['🧑‍🧑‍🧒‍🧒']` is 1 under `clusters` and 7
# under `letters`, because that emoji is seven scalars welded together with
# zero-width joiners and one thing on the page.
#
# `clusters` is what a person counting characters means, and it is UAX #29 as
# published rather than an approximation of it: the tables come from the Unicode
# Character Database and all 766 of Unicode's own conformance cases are checked
# on every build.
#
# What it costs is that the answer is tied to a Unicode version, which is
# **17.0.0** here. Clusters are defined by tables Unicode revises, so a program
# can count differently after a bump nothing else would notice. `letters` is one
# Unicode scalar, which needs no table and never changes.
characters = "clusters"

# Also changes what a program answers, and only started to when `bin` arrived.
# What a `bin` does when there is no number to give back. `carries-on` answers
# `infinity` or `not-a-number` and continues, as a processor does; `stops` stops.
#
# Carrying on is the default for a different reason than `overflow = "wrap"`:
# a `bin` *is* IEEE 754 binary, and `infinity` and `not-a-number` are values of
# that type rather than accidents of it. Asking to stop is asking for something
# narrower than the type you named.
no-number = "carries-on"

# Also changes what a program answers. What reaching past the end of a `many`
# does. `stops` says which place was asked for and how many there are, and stops
# there in every engine; `wraps` takes the index around the length, so `*-1*` is
# the last place and nothing ever stops.
#
# An empty `many` stops under both, because wrapping needs somewhere to land.
#
# Under `stops` an access is a compare and a branch. Native code writes that
# compare out rather than calling the runtime for it, because a call the
# optimiser cannot see into is one it cannot remove — and in a loop counting to
# `count[…]`, LLVM proves the index fits and lifts the check out of the loop.
out-of-range = "stops"

[build]
# Changes what gets delivered, never what a program answers — every level has to
# produce the same number, which is what the oracle checks. `none`, `speed`.
optimise = "speed"

# Also changes what gets delivered, never what a program answers. Which decimal
# a program uses.
#
# `software` is IEEE 754 decimal written out in C++, in the BID encoding — the
# coefficient stored as an ordinary binary integer, because the wide arithmetic
# underneath already speaks that language. It runs on any machine.
#
# `hardware` is IBM's decimal floating-point unit. Two architectures have one:
# z/Architecture from z9, and POWER from POWER6. Both encode in DPD rather than
# BID, so the bits are not the same ones — but no program can see them, and IEEE
# 754 decimal is specified closely enough that both must answer every operation
# identically. Where they do not, one of them is wrong. That is why this is a
# setting worth having rather than a preference: it is a second opinion on the
# arithmetic, from silicon.
#
# What the unit does is add, subtract, multiply, divide and compare, at
# decimal64 and decimal128. So a `deci32` is worked out at decimal64 and rounded
# back whichever is chosen, and a remainder or a power is built out of those
# five either way — there is no instruction for either on any machine.
#
# Both answer every one of thirty thousand sums, differences, products and
# quotients identically, at all three widths, cohorts included — which is
# checked on every build that can reach a decimal unit. See `tests/power/`.
#
# Asking for `hardware` from a build that has none is refused rather than
# quietly answered by the other one. Which a build has is decided when the
# runtime is compiled: `cmake -DXAG_DECIMAL=hardware`, on a machine that has a
# unit. There is no falling back, because falling back is how a program comes to
# use the thing it said it did not want.
decimal = "software"

[run]
# Changes only how a program runs, never what it says.
# `test-interpreter` does the least and is the one to believe.
# `fast-interpreter` runs bytecode. `native` is compiled ahead of time.
engine = "test-interpreter"

# `out-of-range` and `decimal` are read; the rest are decided but not yet asked
# about, because nothing branches on them yet. The file is looked for beside the
# source and then upward, so a project decides for every file under it. A single
# run may say otherwise — `xagc --out-of-range=wraps`, `xagc --decimal=hardware`
# — which is how the oracle asks two languages the same questions, and how a
# build that has both decimals is asked for each in turn.
